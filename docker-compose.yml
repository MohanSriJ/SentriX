version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentrix_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./sentrix.db
      - SECRET_KEY=sentrix-production-ultra-secret-jwt-key-2026
      - SIMULATION_ENABLED=True
    volumes:
      - ./backend/sentrix.db:/app/sentrix.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentrix_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

networks:
  default:
    name: sentrix_network
